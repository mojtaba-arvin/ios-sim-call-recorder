name: iOS app build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: CallRecorderApp simulator build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen only when missing
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate bundled privacy manifest
        run: plutil -lint Apps/CallRecorderApp/Resources/PrivacyInfo.xcprivacy
      - name: Build and test iOS simulator app
        run: xcodebuild -quiet -project CallRecorder.xcodeproj -scheme CallRecorderApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO test
