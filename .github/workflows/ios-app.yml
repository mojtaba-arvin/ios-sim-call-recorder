name: iOS app build

on:
  pull_request:
    paths:
      - "Apps/CallRecorderApp/**"
      - "Packages/CallRecorderCore/**"
      - "project.yml"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: CallRecorderApp simulator build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS simulator app
        run: xcodebuild -project CallRecorder.xcodeproj -scheme CallRecorderApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
