name: Swift package checks

on:
  pull_request:
    branches: [main, feat/swift-recording-core-foundation, feat/iphone-capture-pathway-discovery]
  push:
    branches: [feat/recording-import-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-recorder-core:
    name: CallRecorderCore tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run package tests
        run: swift test --package-path Packages/CallRecorderCore
