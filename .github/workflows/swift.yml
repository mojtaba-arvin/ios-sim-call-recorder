name: Swift package checks

on:
  pull_request:
    branches: [main]
    paths:
      - "Packages/CallRecorderCore/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-recorder-core:
    name: CallRecorderCore tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run package tests
        run: swift test --package-path Packages/CallRecorderCore
