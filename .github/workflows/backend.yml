name: Backend core checks

on:
  pull_request:
    branches: [main, feat/conference-bridge-backend-core, feat/twilio-webhook-signature-adapter, feat/postgres-transactional-outbox, feat/provider-command-dispatcher-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge-core:
    name: Conference bridge backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bridge:bridge@localhost:5432/bridge_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned PostgreSQL driver
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt
      - name: Run backend unit and PostgreSQL integration tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
