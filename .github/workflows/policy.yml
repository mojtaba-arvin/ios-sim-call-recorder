name: Repository policy checks

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_repo_policy.py"
      - "scripts/validate_agent_assets.py"
      - "scripts/validate_agent_tasks.py"
      - "scripts/tests/**"
      - ".agents/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test workflow and agent asset validators
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Validate workflow guardrails
        run: python3 scripts/validate_repo_policy.py
      - name: Validate agent roles, skills and templates
        if: hashFiles('scripts/validate_agent_assets.py') != ''
        run: python3 scripts/validate_agent_assets.py
      - name: Validate example R&D task graph
        if: hashFiles('scripts/validate_agent_tasks.py') != ''
        run: python3 scripts/validate_agent_tasks.py .agents/templates/task.example.json
