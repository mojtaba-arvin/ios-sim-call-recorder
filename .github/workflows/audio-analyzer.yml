name: Audio analyzer checks

on:
  pull_request:
    paths:
      - "scripts/analyze_call_audio.py"
      - "scripts/tests/test_analyze_call_audio.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-analyzer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(scripts/analyze_call_audio\.py|scripts/tests/test_analyze_call_audio\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

    audio-quality-analysis:
    name: Audio quality analyzer tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run local WAV analyzer tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_analyze_call_audio.py'

