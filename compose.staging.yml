services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?inject POSTGRES_PASSWORD from a secret manager}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bridge-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?inject DATABASE_URL from a secret manager}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "asgi:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?inject DATABASE_URL from a secret manager}
      BRIDGE_API_TOKEN_HASHES: ${BRIDGE_API_TOKEN_HASHES:?inject token hash map from a secret manager}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PROVIDER_ACCOUNT_ID: ${TWILIO_PROVIDER_ACCOUNT_ID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_PUBLIC_ORIGIN: ${TWILIO_PUBLIC_ORIGIN:-}
      TWILIO_CONSENT_POLICY_VERSION: ${TWILIO_CONSENT_POLICY_VERSION:-}
      TWILIO_CONSENT_DISCLOSURE: ${TWILIO_CONSENT_DISCLOSURE:-}
      PARTICIPANT_ADDRESS_KEY_HEX: ${PARTICIPANT_ADDRESS_KEY_HEX:-}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-}
      MEDIA_KMS_KEY_ID: ${MEDIA_KMS_KEY_ID:-}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: ["provider"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker_main.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?inject DATABASE_URL from a secret manager}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?inject Twilio Account SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?inject Twilio Auth Token}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_PROVIDER_ACCOUNT_ID: ${TWILIO_PROVIDER_ACCOUNT_ID:?set opaque provider account id}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:?set Twilio caller ID}
      TWILIO_PUBLIC_ORIGIN: ${TWILIO_PUBLIC_ORIGIN:?set public HTTPS origin}
      TWILIO_CONSENT_DISCLOSURE: ${TWILIO_CONSENT_DISCLOSURE:?inject legally reviewed disclosure}
      PARTICIPANT_ADDRESS_KEY_HEX: ${PARTICIPANT_ADDRESS_KEY_HEX:?inject 32-byte vault key}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  retention:
    profiles: ["provider"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "retention_main.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?inject DATABASE_URL from a secret manager}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?inject Twilio Account SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?inject Twilio Auth Token}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_PROVIDER_ACCOUNT_ID: ${TWILIO_PROVIDER_ACCOUNT_ID:?set opaque provider account id}
      MEDIA_BUCKET: ${MEDIA_BUCKET:?set private media bucket}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      MEDIA_KMS_KEY_ID: ${MEDIA_KMS_KEY_ID:?set KMS key}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  bridge-postgres:
